function editItem(add=false,draft=null){const original=add?null:current();const n=draft||original||{title:'',text:'',type:'偏好'};const protectedBody=!add&&(original?.history||original?.tag==='已替代');state.dirty=!!draft;openDialog(add?'新增记忆':'编辑记忆',`${protectedBody?'<div class="notice warn"><div>这条决策位于替代链中。正文只读；新内容请新建决策，再确认替代关系。</div></div>':''}<div class="stack" data-edit><label class="field">名称<input id="edit-title" value="${esc(n.title)}" placeholder="给这条记忆一个容易辨认的名称"></label><label class="field">正文<textarea id="edit-text" ${protectedBody?'readonly':''} placeholder="写下一条完整、可核对的事实或约定">${esc(n.text)}</textarea></label><div class="two-col"><label class="field">类型<select id="edit-type" ${!add?'disabled':''}>${['偏好','决策','实体','经验'].map(t=>`<option ${n.type===t?'selected':''}>${t}</option>`).join('')}</select></label><label class="field">有效期（可选）<input id="edit-until" value="${esc(n.until||'')}" placeholder="如 2026-12-31" aria-label="有效期"></label></div><div id="edit-error" role="alert"></div></div>`,`<button id="cancel-edit">取消</button><button class="primary" id="save-edit">${add?'新增记忆':'保存修改'}</button>`);$('#dialog-body').oninput=()=>state.dirty=true;$('#cancel-edit').onclick=closeDialog;$('#save-edit').onclick=()=>{if(!$('#edit-title').value.trim()||!$('#edit-text').value.trim()){$('#edit-error').textContent='请填写名称和正文。';return}if(scenario()==='conflict'){$('#edit-error').innerHTML='<div class="notice warn"><div><strong>条目已被其他会话修改</strong><p>你的草稿已保留。先读取最新版本并比较，再决定是否重新提交。</p><button id="latest">读取最新版本</button></div></div>';$('#latest').onclick=()=>{$('#edit-error').innerHTML='<div class="callout">最新版本（演示）：名称已由另一会话更新。请核对上方草稿，再保存。</div>';$('#scenario').value='normal'};return}if(add){const id=Date.now();data.unshift({id,title:$('#edit-title').value,text:$('#edit-text').value,type:$('#edit-type').value,source:'手动记录',tag:'当前',time:'刚刚',entity:ws(),workspace:state.workspace,until:$('#edit-until').value});state.selected=id;$('#scenario').value='normal'}else{original.title=$('#edit-title').value;original.text=$('#edit-text').value;original.until=$('#edit-until').value;original.time='刚刚'}state.dirty=false;$('#dialog-body').oninput=null;$('#dialog').close();render();toast(add?'演示：记忆已新增':'演示：修改已保存')}}
function moreActions(){const n=current();openDialog('条目操作',`<p class="muted" style="margin-bottom:16px">针对「${esc(n.title)}」</p><div class="stack"><button id="archive">${n.tag==='已归档'?'取消归档':'归档这条记忆'}</button><button id="replace" ${n.type!=='决策'?'disabled':''}>与另一条决策建立替代关系…</button>${n.history||n.tag==='已替代'?'<button id="revoke">撤销替代关系…</button>':''}<button id="merge">与同类型记忆合并…</button><button id="remove" class="danger">永久删除…</button></div>`);$('#archive').onclick=()=>{if(n.history||n.tag==='已替代'){toast('演示：版本链保护拒绝归档，请先处理替代关系');return}n.tag=n.tag==='已归档'?'当前':'已归档';$('#dialog').close();render();toast('演示：归档状态已更新')};$('#replace').onclick=replaceDialog;$('#revoke')?.addEventListener('click',()=>confirmAction('撤销这条替代关系？','只撤销选定的替代关系，保留两个节点及其他关系；正式版需重新校验当前版本。',()=>toast('演示：撤销确认完成，未修改真实关系')));$('#merge').onclick=()=>openDialog('合并记忆',`<p>选择同类型条目并入「${esc(n.title)}」。正式版应先比较两边内容；链中的决策不可直接合并。</p><div class="callout" style="margin-top:16px">当前演示不执行合并。实现复用现有同类型、版本链保护和操作回执。</div>`);$('#remove').onclick=()=>confirmAction('永久删除这条记忆？',`将删除「${esc(n.title)}」。删除后不可恢复；只想隐藏时请使用归档。`,()=>{if(n.history){toast('演示：版本链保护拒绝删除，请先处理替代关系');return}data=data.filter(x=>x.id!==n.id);state.selected=data[0]?.id;render();toast('演示：记忆已删除')},true)}

function download(name,text,mime){const url=URL.createObjectURL(new Blob([text],{type:mime+';charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),500);toast('已下载合成示例，不含真实记忆')}
const destinations=[['自动记录 / 抽取','behavior','extract'],['自动召回 / 注入策略','behavior','recall'],['芯片 / 钉选标签','display','chips'],['会话层 / 检查点','display','layer'],['语言 / English','display','language'],['导入 / 导出 / Git 同步','data','git'],['向量 / embedding / 服务地址','embedding','embedding'],['SuperAgent / 父级 / 继承','collaboration','scope'],['版本 / 更新 / 维护','about','update'],['恢复 / 锁 / 错误 / 诊断','activity','recovery']];
function searchSettings(){openDialog('查找设置或操作',`<div class="search">${ico('search')}<label class="screen-reader" for="command-query">搜索设置名称</label><input id="command-query" placeholder="如：芯片、恢复、导入、embedding"></div><div id="command-results"></div>`);const show=()=>{const q=$('#command-query').value.toLowerCase();const list=destinations.filter(d=>d[0].toLowerCase().includes(q));$('#command-results').innerHTML=list.length?list.map(d=>`<button class="palette-result" data-destination="${d[1]}" data-target="${d[2]}"><span>${d[0]}</span><small>${d[1]==='activity'?'运行记录':cats.find(c=>c[0]===d[1])?.[1]} →</small></button>`).join(''):'<p class="muted" style="padding:20px">没有找到设置，试试其他名称。</p>';$$('[data-destination]').forEach(b=>b.onclick=()=>{const cat=b.dataset.destination,target=b.dataset.target;$('#dialog').close();navigate(cat==='activity'?'activity':'settings',cat);setTimeout(()=>{const el=document.getElementById('setting-'+target)||$('#main section');el?.classList.add('anchor-flash');el?.scrollIntoView({block:'nearest'});setTimeout(()=>el?.classList.remove('anchor-flash'),2200)},50)})};$('#command-query').oninput=show;$('#command-query').onkeydown=e=>{if(e.key==='ArrowDown'){e.preventDefault();$('#command-results button')?.focus()}if(e.key==='Enter'){e.preventDefault();e.stopPropagation();$('#command-results button')?.click()}};show()}
function specification(){openDialog('设计与实现说明',`<div class="notice"><div><strong>这是信息架构与交互规格，不是已上线功能。</strong><p>基于本地 f2234a6 / package 0.8.3，2026-11-03。所有数据均为合成；本页零 API 请求、零模型调用。当前工作树比远端领先 6 个提交。</p></div></div><h3>目标：让常用操作不用找</h3><p>用户打开面板先找记忆或核对内容，不应先阅读一页诊断和全局开关。保留宿主单一插件入口，内部只设四页；操作放到它的对象旁。</p><table><tr><th>入口</th><th>主要问题</th><th>保留功能</th></tr><tr><td>记忆库（默认）</td><td>记住了什么？哪里要改？</td><td>搜索、类型/历史筛选、正文、来源、历史、关联、编辑、归档、删除、合并、替代/撤销。</td></tr><tr><td>上下文</td><td>这轮发了什么？下次可能发什么？</td><td>实际投递与只读试算分开；预算、过滤原因、真实文本按需展开。</td></tr><tr><td>运行记录</td><td>为什么没记住或没恢复？</td><td>恢复/卡住/已恢复、写入变化、审计缺口、空回答、待发更正、旁路状态及链体检。</td></tr><tr><td>设置</td><td>怎样改变记忆行为？</td><td>行为、显示、数据、向量、协作、关于六类，支持搜索直达；默认值不变。</td></tr></table><h3>页面与现有代码的映射</h3><table><tr><th>设计</th><th>实际接口 / 模块</th><th>不可改变的边界</th></tr><tr><td>工作区与列表</td><td><code>GET /status, /nodes<br>lib/client.js · lib/server.js</code></td><td>所有操作显式带cwd；切视图不切对话工作区；旧响应不得覆盖新库。</td></tr><tr><td>详情 / 来源 / 历史</td><td><code>/nodes/:id/detail<br>/nodes/:id/provenance<br>/nodes/:id/history</code></td><td>没有来源不伪造；来源不可回读不生成跳转；历史与合并前正文分开。</td></tr><tr><td>新增记忆（拟增强入口）</td><td><code>现有 POST /chips 接收 text 并推断类型</code></td><td>本稿的名称/类型/期限表单需要明确的创建接口。可复用既有写入闸门，但不能伪称已有 POST /nodes，也不能为创建自动钉选到会话。实现方需单独补接口验收。</td></tr><tr><td>更改条目</td><td><code>现有节点写入、merge、supersede、supersession/revoke路由</code></td><td>链正文保护、类型约束、ETag/operationId保留；409保留草稿；永久删除确认。</td></tr><tr><td>上下文</td><td><code>GET /turn, /recall-traces<br>POST /recall-preview<br>status.lastMapInjection</code></td><td>实际发送不混入试算；不在前端重算生产预算；读取不触发模型。</td></tr><tr><td>运行记录</td><td><code>GET /changes, /corrections, /integrity<br>status.recovery/stuck/recovered/emptyAnswer/audit/pendingPersistence</code></td><td>未知、空、未加载、损坏是不同状态；超时不等于失败；不存在的记录不得补造。</td></tr><tr><td>设置与数据</td><td><code>POST /settings, /import<br>GET /external, /export, /export.md<br>/sidecar/generate, /sidecar/delete, /embed-backfill</code></td><td>全局配置与按库操作分清；JSON预览必须复用服务端；旁路删除当前涉及全部已知工作区。</td></tr><tr><td>SuperAgent</td><td><code>lib/store.js resolveScope</code></td><td>workspace已实现，parent/inherit拒绝执行；现阶段只读说明，不添加假共享开关。</td></tr></table><h3>交互规格</h3><ul><li>≥1180px：列表与详情并排；900–1179px：列表单列，选择条目后在带焦点陷阱的详情弹窗查看。宿主侧栏空间不能通过隐藏来造假。</li><li>小于900px只是原型自适应探索，不作为现有宿主手机支持承诺。</li><li>即时保存：记忆行为、芯片、Git、语言；先本地反馈保存中，成功后确认，失败回滚并保留错误。向量表单独立保存。</li><li>未保存草稿离开或切库时确认；成功/拒绝/未送达/冲突/派生文件失败分别呈现。不要用统一成功toast掩盖后端状态。</li><li>自动替换判据和权限不属于本轮重设计。详情中的人工确认入口不能改变抽取契约。</li><li>保留芯片页与会话画布；本稿只重组设置入口，不重写其宿主标签或画布。</li><li>使用宿主主题、按钮和模块加载方式。不得把整个HTML外框、独立CSS或模拟数据直接塞入lib/client.js。</li></ul><h3>实施顺序与验收</h3><ol><li>先做导航和路由映射，保留所有已有操作；补工作区和请求竞态回归。</li><li>实现列表/详情，检查长正文、空来源、归档/过期/已替代、409和删除取消。</li><li>迁移上下文与诊断，验证每条状态来自真实响应，原始技术信息仍可展开。</li><li>重组设置并接入搜索，复核全局作用域、即时/显式保存和embedding敏感字段。</li><li>在隔离宿主中检查900/1280/1440px、中英、深浅主题、Tab/Enter/Escape、弹窗焦点归还。禁止启动或改动用户默认工作区做验收。</li></ol><h3>可演示的流程</h3><p>搜索与筛选 → 查看详情 → 来源/历史 → 编辑/409 → 归档/删除确认；Ctrl K 搜索设置；全局开关和向量表单；只读试算；JSON预览/失败；工作区切换；深浅色。顶部场景选择、重置和本说明属于设计工具，正式产品删除。</p><h3>视觉系统</h3><p>冷灰工作底色、白色操作区、克制的松绿色状态；结构以列表和分隔线为主，避免把每项设置变成大卡片。标题使用系统Bahnschrift/Segoe UI，中文正文使用Microsoft YaHei UI，数据使用Consolas。映射到宿主token后优先遵守宿主主题。</p>`, '',true)}
$$('[data-page]').forEach(b=>b.onclick=()=>navigate(b.dataset.page));$('#find-setting').onclick=searchSettings;$('#spec').onclick=specification;$('#theme').onclick=()=>{const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';$('#theme').textContent=dark?'浅色预览':'深色预览'};$('#scenario').onchange=()=>render();$('#workspace').onchange=e=>{const target=e.target.value;if(state.embeddingDirty){e.target.value=state.workspace;openDialog('先处理未保存的配置','<p>向量配置尚未保存。请先保存或放弃，再切换查看的工作区。</p>');return}state.workspace=target;state.selected=41;state.query='';state.filter='全部';render();toast(`正在查看 ${ws()}；对话工作区未改变`)};$('#reset').onclick=()=>{data=structuredClone(seed);state={page:'memory',workspace:'atlas',selected:41,filter:'全部',query:'',extra:{archived:false,stale:false,superseded:false},section:'behavior',detailTab:'content',contextTab:'sent',dirty:false,embeddingDirty:false};Object.assign(settings,{extract:true,chips:false,layer:false,git:false,embedding:false,recall:'off',language:'跟随宿主'});$('#scenario').value='normal';$('#workspace').value='atlas';render();toast('设计稿已重置')};
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();searchSettings()}const tab=e.target.closest('[role=tab]');if(tab&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const list=[...tab.parentElement.querySelectorAll('[role=tab]')];let i=list.indexOf(tab);i=e.key==='Home'?0:e.key==='End'?list.length-1:(i+(e.key==='ArrowRight'?1:-1)+list.length)%list.length;list[i].click()}});
render();
</script></body></html>
