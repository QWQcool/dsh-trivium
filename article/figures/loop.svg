<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" font-family="-apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <style>
    .bg{fill:#f8fafc}
    .card{fill:#ffffff;stroke:#e2e8f0;stroke-width:1.5}
    .bubble{fill:#eff6ff;stroke:#bfdbfe;stroke-width:1.5}
    .node{fill:#f0fdf4;stroke:#86efac;stroke-width:1.5}
    .store{fill:#f1f5f9;stroke:#cbd5e1;stroke-width:1.5}
    .title{font-weight:700;font-size:19px;fill:#0f172a}
    .stage{font-weight:700;font-size:14px;fill:#1d4ed8}
    .stageb{font-weight:700;font-size:14px;fill:#15803d}
    .txt{font-size:12.5px;fill:#334155}
    .txtb{font-size:12.5px;fill:#1e40af;font-weight:600}
    .sub{font-size:11px;fill:#64748b}
    .tag{font-size:11px;fill:#15803d}
    .arrow{stroke:#475569;stroke-width:2;fill:none}
    .arrowg{stroke:#16a34a;stroke-width:2;fill:none}
  </style>

  <rect class="bg" x="0" y="0" width="720" height="500"/>
  <text class="title" x="360" y="34" text-anchor="middle">一次跨会话回路</text>

  <!-- time axis -->
  <line x1="60" y1="58" x2="660" y2="58" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#at)"/>
  <text class="sub" x="150" y="52" text-anchor="middle">会话 A（写入）</text>
  <text class="sub" x="360" y="52" text-anchor="middle">持久化</text>
  <text class="sub" x="570" y="52" text-anchor="middle">会话 B（检索）</text>

  <!-- STAGE A -->
  <text class="stage" x="135" y="92" text-anchor="middle">会话 A</text>
  <rect class="bubble" x="45" y="104" width="180" height="54" rx="12"/>
  <text class="txtb" x="135" y="126" text-anchor="middle">用户：记住，</text>
  <text class="txtb" x="135" y="144" text-anchor="middle">鉴权走 header X</text>

  <rect class="card" x="55" y="178" width="160" height="40" rx="8"/>
  <text class="txt" x="135" y="203" text-anchor="middle">抽取 / ctx_remember</text>

  <rect class="node" x="50" y="238" width="170" height="52" rx="10"/>
  <text class="txtb" x="135" y="262" text-anchor="middle">preference:</text>
  <text class="txtb" x="135" y="280" text-anchor="middle">鉴权走 header X</text>
  <text class="tag" x="50" y="306" text-anchor="start">（about → AuthGateway）</text>

  <!-- STORE (middle) -->
  <rect class="store" x="300" y="150" width="120" height="230" rx="12"/>
  <text class="txt" x="360" y="178" text-anchor="middle" font-weight="700" fill="#0f172a">TriviumDB</text>
  <text class="sub" x="360" y="196" text-anchor="middle">跨会话持久化</text>
  <!-- mini graph glyph -->
  <circle cx="345" cy="250" r="14" fill="#dbeafe" stroke="#3b82f6"/>
  <circle cx="385" cy="250" r="14" fill="#dcfce7" stroke="#22c55e"/>
  <circle cx="360" cy="300" r="14" fill="#fef3c7" stroke="#f59e0b"/>
  <line x1="345" y1="250" x2="385" y2="250" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="360" y1="264" x2="360" y2="286" stroke="#94a3b8" stroke-width="1.5"/>
  <text class="sub" x="360" y="350" text-anchor="middle">.dsh/</text>
  <text class="sub" x="360" y="364" text-anchor="middle">trivium.tdb</text>

  <!-- write arrow A -> store -->
  <path class="arrowg" d="M220 264 C260 264 280 250 298 250" marker-end="url(#ag)"/>
  <text class="sub" x="250" y="244" text-anchor="middle">写入</text>

  <!-- STAGE B -->
  <text class="stageb" x="585" y="92" text-anchor="middle">会话 B</text>
  <rect class="bubble" x="495" y="104" width="190" height="40" rx="10"/>
  <text class="txtb" x="590" y="129" text-anchor="middle">模型: ctx_find('鉴权')</text>

  <rect class="card" x="495" y="160" width="190" height="40" rx="8"/>
  <text class="txt" x="590" y="185" text-anchor="middle">命中 L0 摘要 + path</text>

  <rect class="card" x="495" y="216" width="190" height="40" rx="8"/>
  <text class="txt" x="590" y="241" text-anchor="middle">ctx_read(id): 全文 + 入边</text>

  <rect class="card" x="495" y="272" width="190" height="54" rx="8"/>
  <text class="txt" x="590" y="294" text-anchor="middle">find('AuthGateway')</text>
  <text class="txt" x="590" y="312" text-anchor="middle">→ 邻居(正文无此名)</text>

  <!-- read arrow store -> B -->
  <path class="arrow" d="M420 250 C460 250 470 245 493 200" marker-end="url(#ab)"/>
  <text class="sub" x="455" y="232" text-anchor="middle">读取</text>

  <defs>
    <marker id="at" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#16a34a"/></marker>
    <marker id="ab" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#475569"/></marker>
  </defs>
</svg>
