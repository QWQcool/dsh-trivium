<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="-apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <style>
    .bg{fill:#f8fafc}
    .ent{fill:#dbeafe;stroke:#3b82f6;stroke-width:1.5}
    .pref{fill:#dcfce7;stroke:#22c55e;stroke-width:1.5}
    .dec{fill:#fef3c7;stroke:#f59e0b;stroke-width:1.5}
    .arch{fill:#f1f5f9;stroke:#cbd5e1;stroke-width:1.5}
    .title{font-weight:700;font-size:19px;fill:#0f172a}
    .name{font-weight:700;font-size:14px}
    .sub{font-size:11px;fill:#64748b}
    .edge{font-size:12px;font-weight:700;fill:#475569}
    .cap{font-size:12px;fill:#475569}
    .ring{fill:none;stroke:#2563eb;stroke-width:2;stroke-dasharray="5 4"}
    .ln{stroke:#475569;stroke-width:2;fill:none}
  </style>

  <rect class="bg" x="0" y="0" width="720" height="440"/>
  <text class="title" x="360" y="34" text-anchor="middle">图模型：边是一等公民</text>

  <!-- AuthGateway (center-left) -->
  <rect class="ent" x="150" y="180" width="160" height="56" rx="10"/>
  <text class="name" x="230" y="206" text-anchor="middle" fill="#1e40af">AuthGateway</text>
  <text class="sub" x="230" y="224" text-anchor="middle">entity</text>

  <!-- preference (top-right) -->
  <rect class="pref" x="470" y="80" width="200" height="52" rx="10"/>
  <text class="name" x="570" y="106" text-anchor="middle" fill="#15803d">鉴权走 header X</text>
  <text class="sub" x="570" y="124" text-anchor="middle">preference</text>
  <path class="ln" d="M470 110 C420 110 410 200 312 206" marker-end="url(#e)"/>
  <text class="edge" x="392" y="150">about</text>

  <!-- decision (mid-right) -->
  <rect class="dec" x="470" y="250" width="200" height="52" rx="10"/>
  <text class="name" x="570" y="276" text-anchor="middle" fill="#b45309">决定用方案B</text>
  <text class="sub" x="570" y="294" text-anchor="middle">decision · until: 周五</text>
  <path class="ln" d="M470 278 C420 278 410 220 312 236" marker-end="url(#e)"/>
  <text class="edge" x="388" y="262">decided</text>

  <!-- archived (bottom-right) -->
  <rect class="arch" x="470" y="366" width="200" height="46" rx="10"/>
  <text class="name" x="570" y="394" text-anchor="middle" fill="#475569">旧流程（已归档）</text>
  <path class="ln" d="M570 302 V364" marker-end="url(#e)"/>
  <text class="edge" x="578" y="338">broke</text>

  <!-- highlight ring on AuthGateway to show neighbor reach -->
  <rect class="ring" x="140" y="170" width="180" height="76" rx="14"/>
  <path class="ln" d="M330 208 C380 208 400 360 466 389" stroke="#2563eb" stroke-dasharray="4 4" marker-end="url(#eb)"/>
  <text class="cap" x="398" y="320" fill="#2563eb" font-weight="700">find('AuthGateway') 摸到邻居</text>

  <text class="cap" x="360" y="430" text-anchor="middle">边承载线索：邻居正文里可能压根没写 "AuthGateway"</text>

  <defs>
    <marker id="e" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#475569"/></marker>
    <marker id="eb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/></marker>
  </defs>
</svg>
